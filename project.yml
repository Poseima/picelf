name: Picelf
options:
  bundleIdPrefix: com.picelf.open
  deploymentTarget:
    macOS: "14.0"
    iOS: "16.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: false
    Release:
      ENABLE_HARDENED_RUNTIME: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: "1.15.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.0.0"

targets:
  Picelf:
    type: application
    platform: macOS
    sources:
      - path: Sources/Picelf
      - path: Sources/PicelfCore
      - path: licenses
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    preBuildScripts:
      - name: Remove stale test bundles
        basedOnDependencyAnalysis: false
        script: |
          APP_PLUGINS_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/PlugIns"
          if [ -d "${APP_PLUGINS_DIR}" ]; then
            rm -rf "${APP_PLUGINS_DIR}"/*.xctest
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picelf.open.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/Picelf/Picelf.entitlements
        INFOPLIST_FILE: Sources/Picelf/Info.plist
        PRODUCT_NAME: Picelf
        PRODUCT_MODULE_NAME: Picelf
        COMBINE_HIDPI_IMAGES: true
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 3
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle

  PicelfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PicelfCoreTests
        excludes:
          - "Fixtures/**"
      - path: Tests/RelayTests
    dependencies:
      - target: Picelf
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picelf.open.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Picelf.app/Contents/MacOS/Picelf"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"

  PicelfIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/PicelfIOS
      - path: Sources/PicelfCore
        excludes:
          - "Capture/WindowCaptureStream.swift"
          - "Capture/WindowEnumerator.swift"
          - "Capture/ScreenCoordinateSpace.swift"
          - "WebAssist/ChromeDOMHintProvider.swift"
          - "Recording/ScreenRecorder.swift"
      - path: licenses
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picelf.open.ios
        INFOPLIST_FILE: Sources/PicelfIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PicelfIOS/PicelfIOS.entitlements
        PRODUCT_NAME: Picelf
        PRODUCT_MODULE_NAME: Picelf
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 3
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: PicelfBroadcastUpload
        embed: true

  PicelfBroadcastUpload:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/PicelfBroadcastUpload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picelf.open.ios.broadcast-upload
        INFOPLIST_FILE: Sources/PicelfBroadcastUpload/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PicelfBroadcastUpload/PicelfBroadcastUpload.entitlements
        PRODUCT_NAME: PicelfBroadcastUpload
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 3
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

  PicelfUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/PicelfUITests
    dependencies:
      - target: Picelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picelf.open.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Picelf
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"

  PicelfIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PicelfIOSTests
        excludes:
          - "Fixtures/**"
      - path: Tests/RelayTests
    dependencies:
      - target: PicelfIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picelf.open.ios.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Picelf.app/Picelf"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

  PicelfIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PicelfIOSUITests
    dependencies:
      - target: PicelfIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picelf.open.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: PicelfIOS
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

schemes:
  PicelfIOS:
    build:
      targets:
        PicelfIOS: all
        PicelfBroadcastUpload: all
        PicelfIOSTests: [test]
        PicelfIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PicelfIOSTests
        - PicelfIOSUITests
    profile:
      config: Release
    archive:
      config: Release

  Picelf:
    build:
      targets:
        Picelf: all
        PicelfTests: [test]
        PicelfUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PicelfTests
        - PicelfUITests
    profile:
      config: Release
    archive:
      config: Release
