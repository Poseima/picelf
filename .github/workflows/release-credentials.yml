name: Check release credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Import release certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: ./scripts/release/setup-signing.sh
      - name: Validate signing identity and notarization authentication
        env:
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          security find-identity -v -p codesigning "$PICELF_SIGNING_DIR/release.keychain-db" | grep -F -- "$DEVELOPER_ID_IDENTITY" >/dev/null
          xcrun notarytool store-credentials picelf-release \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$PICELF_SIGNING_DIR/release.keychain-db" >/dev/null
          # Verify access without logging prior submissions or submitting software.
          xcrun notarytool history --keychain-profile picelf-release \
            --keychain "$PICELF_SIGNING_DIR/release.keychain-db" >/dev/null
          echo 'Release certificate and notarization authentication validated.'
      - name: Clean signing credentials
        if: always()
        run: ./scripts/release/cleanup-signing.sh
